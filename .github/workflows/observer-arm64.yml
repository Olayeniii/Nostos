name: Build ARM64 observer binary
# Manual while the hosted Actions allowance is exhausted.
# See docs/CI_VALIDATION.md before restoring automatic events.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v4
        with:
          path: nostos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zcash/zallet
          ref: 987382f67e622915228686e9f956c6a9c9a7514c
          path: zallet
          persist-credentials: false
      - name: Install build dependencies on GitHub runner only
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config libssl-dev protobuf-compiler
      - uses: actions/checkout@v4
        with:
          repository: zodl-inc/zaino
          ref: d2d06bdd6591f3b238a3829b8f1b973ae0ec40be
          path: zaino
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zallet/backends/zaino/target
          key: observer-arm64-release-v2-${{ hashFiles('nostos/scripts/observer/*patch') }}
          restore-keys: |
            observer-arm64-release-v1-
      - name: Verify pinned source and observer patch
        working-directory: zallet
        run: |
          test "$(git rev-parse HEAD)" = 987382f67e622915228686e9f956c6a9c9a7514c
          git apply --check ../nostos/scripts/observer/zallet-ufvk.patch
          git apply ../nostos/scripts/observer/zallet-ufvk.patch
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('zallet-core/src/components/json_rpc/methods/import_viewing_key.rs')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'a5df373ea4406af55cc203487a8f5eb2f70c5cac3a2c498428b2f6a96c7b26f2'
          PY
      - name: Prepare pinned chain-read timeout patch
        run: python3 nostos/scripts/observer/prepare-transport.py zallet zaino
      - name: Test chain-read timeout policy
        working-directory: zallet
        run: |
          rustc +1.95.0 --test backends/zaino/nostos-transport-policy.rs -o /tmp/nostos-transport-policy
          /tmp/nostos-transport-policy
      - name: Build ARM64 Zaino backend
        id: backend
        working-directory: zallet
        run: cargo +1.95.0 build --locked --release --manifest-path backends/zaino/Cargo.toml
      - uses: actions/cache/save@v4
        if: steps.backend.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zallet/backends/zaino/target
          key: observer-arm64-release-v2-${{ hashFiles('nostos/scripts/observer/*patch') }}
      - name: Run Orchard key checks on ARM64
        working-directory: zallet
        env:
          CARGO_TARGET_DIR: backends/zaino/target
        run: cargo +1.95.0 test --locked --release --manifest-path Cargo.toml -p zallet-core --lib nostos_
      - name: Check binary version and native linkage
        run: |
          zallet/backends/zaino/target/release/zallet-zaino --version
          ldd zallet/backends/zaino/target/release/zallet-zaino
      - name: Package binary and provenance without wallet files
        run: python3 nostos/scripts/observer/package-arm64.py zallet/backends/zaino/target/release/zallet-zaino bundle
      - uses: actions/upload-artifact@v4
        with:
          name: nostos-observer-ubuntu24-arm64-${{ github.sha }}
          path: bundle/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
