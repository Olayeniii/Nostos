name: Read-only lightwalletd SDK probe
on:
  push:
    branches: [main]
    paths:
      - scripts/lightclient/**
      - .github/workflows/lightclient-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          path: nostos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zcash/zallet
          ref: 987382f67e622915228686e9f956c6a9c9a7514c
          path: zallet
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config libssl-dev protobuf-compiler age
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zallet/target
          key: lightclient-observer-v2-987382f
          restore-keys: |
            lightclient-probe-v1-987382f
            observer-Linux-987382f-
      - name: Add only the public-chain SDK example
        run: |
          test "$(git -C zallet rev-parse HEAD)" = 987382f67e622915228686e9f956c6a9c9a7514c
          mkdir -p zallet/zallet-core/examples
          cp nostos/scripts/lightclient/probe.rs zallet/zallet-core/examples/nostos_lightclient_probe.rs
          mkdir -p zallet/zallet-core/examples/nostos_observer
          cp nostos/scripts/lightclient/connection.rs zallet/zallet-core/examples/nostos_observer/connection.rs
          cp nostos/scripts/lightclient/worker.rs zallet/zallet-core/examples/nostos_sdk_worker.rs
          cp nostos/scripts/lightclient/observer.rs zallet/zallet-core/examples/nostos_observer/mod.rs
          cp nostos/scripts/lightclient/storage.rs zallet/zallet-core/examples/nostos_observer/storage.rs
          cp nostos/scripts/lightclient/transactions.rs zallet/zallet-core/examples/nostos_observer/transactions.rs
          cp nostos/scripts/lightclient/transaction_tests.rs zallet/zallet-core/examples/nostos_observer/transaction_tests.rs
          cp nostos/scripts/lightclient/observer_fixture.rs zallet/zallet-core/examples/nostos_observer_fixture.rs
          cp nostos/scripts/lightclient/recovery_fixture.rs zallet/zallet-core/examples/nostos_recovery_fixture.rs
          python3 nostos/scripts/lightclient/prepare.py zallet
      - name: Test full viewing key decoding without a real key
        working-directory: zallet
        run: cargo +1.95.0 test --locked -p zallet-core --example nostos_lightclient_probe
      - name: Check two hosted mainnet services with the pinned SDK
        working-directory: zallet
        run: cargo +1.95.0 run --locked -p zallet-core --example nostos_lightclient_probe
      - name: Test encrypted backups and refusal boundaries
        run: python3 -m unittest discover -s nostos/scripts/lightclient -p test_backup.py
      - name: Test observer cache gaps and rewind behavior
        working-directory: zallet
        env:
          NOSTOS_BACKUP_FIXTURE: ../nostos/scripts/lightclient/backup_fixture.py
        run: cargo +1.95.0 test --locked -p zallet-core --example nostos_observer_fixture
      - name: Build private pipe worker
        working-directory: zallet
        run: cargo +1.95.0 build --locked -p zallet-core --example nostos_sdk_worker
      - name: Test local service authentication and boundaries
        run: node --test nostos/scripts/lightclient/service.test.mjs
      - name: Prove committed and uncommitted WAL recovery after abrupt exit
        working-directory: zallet
        run: cargo +1.95.0 run --locked -p zallet-core --example nostos_recovery_fixture
      - name: Prove temporary view-only sync, reopen and authenticated service connection
        working-directory: zallet
        env:
          NOSTOS_SERVICE_E2E_SCRIPT: ../nostos/scripts/lightclient/service-e2e.mjs
        run: cargo +1.95.0 run --locked -p zallet-core --example nostos_observer_fixture
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zallet/target
          key: lightclient-observer-v2-987382f
