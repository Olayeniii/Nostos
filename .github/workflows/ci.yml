name: ci

# Manual while the hosted Actions allowance is exhausted.
# See docs/CI_VALIDATION.md before restoring automatic events.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @nostos/web build
      - run: python3 -m unittest discover -s scripts/web -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/observer -p 'test_*.py'
