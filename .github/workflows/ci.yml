name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm check
      - run: pnpm --filter @nostos/web build
      - run: python3 -m unittest discover -s scripts/web -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/observer -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/quality -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/merchant-control -p 'test_*.py'
